<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oro — Original Soundtrack</title>
<style>
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 20%, #2A1240, #07080B 70%); color: #E8ECF2; font-family: Poppins, system-ui, sans-serif; display: flex; justify-content: center; }
  main { width: min(640px, 100%); padding: 40px 20px; }
  img { width: 220px; border-radius: 16px; display: block; margin: 0 auto 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { text-align: center; font-weight: 600; letter-spacing: -0.03em; margin: 0; } p.sub { text-align: center; color: #9AA3B2; margin: 4px 0 28px; }
  .t { background: rgba(255,255,255,.04); border: 1px solid #2A303C; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .t h2 { font-size: 16px; margin: 0 0 2px; } .t .m { font-size: 12px; color: #9AA3B2; } .t p { font-size: 13px; line-height: 1.5; color: #C8CDD6; margin: 8px 0; }
  audio { width: 100%; height: 36px; }
</style></head>
<body><main>
  <img src="out/cover.png" alt="Oro — Original Soundtrack">
  <h1>Oro — Original Soundtrack</h1><p class="sub">Five pieces for Orobi · synthesised from code</p>
  <div id="list"></div>
</main>
<script>
const T = [
  ['01-orobi-main-theme', 'Orobi (Main Theme)', 'D major · 100 BPM', 'A spark in the dark, Orobi waking, the groove, the lift, the anthem as the site goes live, and home.'],
  ['02-infinity-loop', 'Infinity Loop', 'F major · 80 BPM, swung', 'Working together late: warm keys, vinyl dust, the motif half-whispered. Loop it under a long session.'],
  ['03-describe-it', 'Describe It', 'A major · 122 BPM', 'One sentence, and something starts building. Keystroke arps and a grinning hook.'],
  ['04-night-build', 'Night Build', 'B minor → D major · 68 BPM', 'Orobi works while you sleep. The motif in minor, and at the end, morning.'],
  ['05-unleashed', 'Unleashed', 'D → E major · 132 BPM', 'Ship it. The full theme, and a last chorus that lifts a whole step.'],
];
const list = document.getElementById('list');
T.forEach(([f, t, m, d], i) => {
  list.insertAdjacentHTML('beforeend', `<div class="t"><h2>${i + 1}. ${t}</h2><div class="m">${m}</div><p>${d}</p><audio controls preload="none" src="out/${f}.mp3"></audio></div>`);
});
// Play the album through.
const audios = [...list.querySelectorAll('audio')];
audios.forEach((a, i) => a.addEventListener('ended', () => audios[i + 1]?.play()));
audios.forEach((a) => a.addEventListener('play', () => audios.forEach((b) => b !== a && b.pause())));
</script></body></html>
