// Compose compiler stability configuration.
//
// Classes listed here are treated as stable by the Compose compiler, so a
// composable that takes them as parameters can be skipped when they are equal.
// Everything below lives in modules that are NOT compiled with the Compose
// compiler (core:data, core:common, the JDK), which means Compose cannot infer
// their stability itself and would otherwise treat every one of them as
// unstable -- defeating skipping for whole screens (project list, git panels,
// model lists, file tree).
//
// Only list types that are deeply immutable in practice: all-`val` data
// classes and enums whose collections are replaced wholesale, never mutated.
// Adding a type with mutable state here is a correctness bug (stale UI).

// --- JDK -----------------------------------------------------------------
java.time.*
java.io.File
java.util.UUID

// --- Kotlin collections ---------------------------------------------------
// Every list/map/set handed to the UI comes out of a StateFlow and is replaced,
// never mutated in place.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// --- Domain / persistence models (core:data) ------------------------------
com.oro.app.domain.model.**
com.oro.app.data.local.entity.**

