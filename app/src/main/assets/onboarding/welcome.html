<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{--bg:#0B0D12;--surface:#12151C;--line:#262C38;--on:#E8ECF2;--muted:#8A93A3;background:var(--bg);color:var(--on);font:14px system-ui,sans-serif}
.light{--bg:#F4F5F7;--surface:#FFFFFF;--line:#D8DCE3;--on:#0E1117;--muted:#677084}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) center/20px 20px;isolation:isolate}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 30%,var(--bg) 76%);z-index:-1}
.mascot{width:74%;overflow:visible}
.body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.shadow{fill:var(--on);opacity:.08}
.hello{width:100%;display:grid;place-items:center;gap:26px}
.caption{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.prompt-stage .mascot{position:absolute;left:1%;top:40%;width:49%}
.prompt{position:absolute;top:12%;left:5%;padding:12px 16px;border:1px solid var(--line);background:var(--surface);border-radius:24px;font-size:12px;z-index:2}
.prompt:before{content:"✦";margin-right:9px;color:#F800F8}
.phone{position:absolute;right:5%;top:20%;width:38%;height:71%;border:2px solid var(--on);border-radius:24px;background:var(--surface);padding:26px 10px 10px;box-shadow:0 10px 0 #8888880b}
.notch{position:absolute;top:9px;left:38%;width:24%;height:5px;border-radius:9px;background:var(--on)}
.nav{width:32%;height:5px;background:var(--on);border-radius:4px;margin-bottom:15px}
.block{border:1px solid var(--line);border-radius:9px;padding:12px 8px;margin:7px 0;animation:build 11s ease infinite;animation-delay:var(--delay,0s)}
.block.hero{height:37%;background:color-mix(in srgb,var(--on) 5%,var(--surface))}
.line{height:5px;width:84%;border-radius:5px;background:var(--on);margin:0 0 7px;opacity:.8}
.short{width:55%;opacity:.3}
.pill{width:40%;height:10px;background:var(--on);border-radius:10px;margin-top:10px}
.hot{border-color:var(--on)}
.live{position:absolute;bottom:5%;left:5%;font-size:11px;color:var(--muted);animation:live 11s infinite}
.live:before{content:"✓";display:inline-grid;place-items:center;width:17px;height:17px;margin-right:7px;background:#3DDC97;border-radius:50%;color:#0B0D12}
.thinking{position:absolute;left:10%;top:50%;width:30%;overflow:visible;animation:thinking 11s infinite}
.thinking path{fill:none;stroke:#F800F8;stroke-width:90;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24 76;animation:dash 1.6s linear infinite}
.prompt-stage .mascot .body{animation:transformBody 11s infinite}
.orbit{width:90%;height:90%;max-height:310px;aspect-ratio:1;position:relative;display:grid;place-items:center}
.orbit:before{content:"";position:absolute;width:75%;height:75%;border:1px dashed var(--line);border-radius:50%}
.orbit .mascot{width:45%}
.node{position:absolute;left:calc(50% + var(--x)*1%);top:calc(50% + var(--y)*1%);transform:translate(-50%,-50%);padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted);animation:node 4s ease-in-out infinite;animation-delay:var(--delay)}
@keyframes breathe{50%{transform:scale(1.02,.98)}
}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}
95%{transform:scaleY(.1)}
}
@keyframes dash{to{stroke-dashoffset:-100}
}
@keyframes build{0%,25%{opacity:0;transform:translateY(12px)}
42%,93%{opacity:1;transform:none}
100%{opacity:0}
}
@keyframes live{0%,66%,100%{opacity:0}
72%,93%{opacity:1}
}
@keyframes thinking{0%,23%,65%,100%{opacity:0}
30%,58%{opacity:1}
}
@keyframes transformBody{0%,20%,68%,100%{opacity:1;transform:none}
27%,59%{opacity:0;transform:scale(.9)}
73%{transform:translateY(-90px) scale(.98,1.03)}
79%{transform:scale(1.06,.94)}
85%{transform:none}
}
@keyframes node{50%{border-color:var(--muted);color:var(--on)}
}
.still *{animation:none!important}
.still .thinking{display:none}
.still .block,.still .live{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}
.thinking{display:none}
.block,.live{opacity:1}
}

</style>
</head>
