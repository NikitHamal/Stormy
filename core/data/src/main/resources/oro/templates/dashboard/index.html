<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roastery · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="oro-ui/oro.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="oro-ui/oro.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">R</span>Roastery</a>
      <nav class="stack side-nav">
        <a class="sidebar-link" href="#" aria-current="page">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Overview</a>
        <a class="sidebar-link" href="#orders">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Orders</a>
        <a class="sidebar-link" href="#products">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/></svg>Products</a>
        <a class="sidebar-link" href="#">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/></svg>Customers</a>
      </nav>
      <div class="side-foot">
        <button class="btn btn-ghost btn-sm" data-theme-toggle>Switch theme</button>
      </div>
    </aside>

    <div class="app-body">
      <header class="app-top">
        <button class="btn btn-ghost btn-icon" data-sidebar-toggle aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <strong>Roastery</strong>
      </header>

      <main class="app-main" id="main">
        <div class="page-head">
          <div>
            <h1>Overview</h1>
            <p class="muted">January – March 2026</p>
          </div>
          <button class="btn btn-primary" id="new-order">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New order
          </button>
        </div>

        <div class="alert alert-error" id="load-error" role="alert" hidden>
          <span>Couldn’t load orders. Check that the preview server is running.</span>
          <button class="btn btn-sm btn-outline" id="retry">Try again</button>
        </div>

        <section class="stats" aria-label="Key numbers" id="stats">
          <div class="stat"><div class="stat-label">Revenue</div><div class="stat-value" id="s-revenue"><span class="skeleton" style="height:32px;width:120px"></span></div><div class="stat-delta" id="d-revenue"></div></div>
          <div class="stat"><div class="stat-label">Orders</div><div class="stat-value" id="s-orders"><span class="skeleton" style="height:32px;width:64px"></span></div><div class="stat-delta" id="d-orders"></div></div>
          <div class="stat"><div class="stat-label">Average order</div><div class="stat-value" id="s-aov"><span class="skeleton" style="height:32px;width:90px"></span></div><div class="stat-delta" id="d-aov"></div></div>
          <div class="stat"><div class="stat-label">Refund rate</div><div class="stat-value" id="s-refunds"><span class="skeleton" style="height:32px;width:70px"></span></div><div class="stat-delta" id="d-refunds"></div></div>
        </section>

        <section class="panels">
          <article class="card panel">
            <div class="panel-head"><h2>Revenue by week</h2><span class="badge">12 weeks</span></div>
            <div class="chart" id="chart-revenue"><div class="skeleton" style="height:200px"></div></div>
          </article>
          <article class="card panel" id="products">
            <div class="panel-head"><h2>Top products</h2></div>
            <ul class="top-list" id="top-products"><li class="skeleton" style="height:120px"></li></ul>
          </article>
        </section>

        <section class="card panel" id="orders">
          <div class="panel-head">
            <h2>Recent orders</h2>
            <label class="search"><span class="sr">Search orders</span><input class="input" type="search" placeholder="Search orders" id="order-search"></label>
          </div>
          <div id="orders-table"><div class="skeleton" style="height:280px"></div></div>
        </section>
      </main>
    </div>
  </div>

  <dialog class="modal" id="order-dialog" aria-labelledby="order-title">
    <form method="dialog" class="modal-body stack" id="order-form" novalidate>
      <h2 id="order-title">New order</h2>
      <div class="field"><label class="label" for="o-customer">Customer</label><input class="input" id="o-customer" required autocomplete="off"></div>
      <div class="field"><label class="label" for="o-product">Product</label>
        <select class="select" id="o-product">
          <option value="Ethiopia Guji · 250g" data-price="18">Ethiopia Guji · 250g — $18</option>
          <option value="Colombia Huila · 250g" data-price="16">Colombia Huila · 250g — $16</option>
          <option value="House Espresso · 1kg" data-price="42">House Espresso · 1kg — $42</option>
          <option value="Pour-over Kit" data-price="64">Pour-over Kit — $64</option>
          <option value="Gift Box" data-price="38">Gift Box — $38</option>
        </select>
      </div>
      <div class="field"><label class="label" for="o-qty">Quantity</label><input class="input" id="o-qty" type="number" min="1" max="20" value="1" required></div>
      <p class="error" id="o-error" hidden>Add the customer’s name.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" value="cancel" type="button" id="o-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="o-save">Save order</button>
      </div>
    </form>
  </dialog>
</body>
</html>
