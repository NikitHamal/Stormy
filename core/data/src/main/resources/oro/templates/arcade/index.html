<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0420">
  <title>Starhop · Dodge the rocks, catch the stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="oro-ui/oro.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="oro-ui/oro.js" defer></script>
  <script src="js/game.js" defer></script>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Starhop game. Move left and right to dodge rocks and catch stars." role="img"></canvas>

    <div class="hud" aria-live="polite">
      <div class="hud-block"><span class="hud-label">Score</span><strong id="score">0</strong></div>
      <div class="lives" id="lives" aria-label="3 lives"><i></i><i></i><i></i></div>
      <button class="hud-btn" id="pause" aria-label="Pause" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
    </div>

    <section class="screen" id="start">
      <p class="tag">Arcade</p>
      <h1>Star<span>hop</span></h1>
      <p>Dodge the rocks. Catch the stars. It gets faster.</p>
      <button class="play" id="play">Play</button>
      <p class="hint">Drag or use ← → · Space to pause</p>
      <p class="best" id="best-start"></p>
    </section>

    <section class="screen" id="paused" hidden>
      <h2>Paused</h2>
      <button class="play" id="resume">Resume</button>
    </section>

    <section class="screen" id="over" hidden>
      <p class="tag">Game over</p>
      <h2 id="final">0</h2>
      <p id="final-note"></p>
      <button class="play" id="again">Play again</button>
    </section>
  </main>
</body>
</html>
