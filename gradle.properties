# Project-wide Gradle settings.

# 4 GB heap: the Compose compiler plus KSP on a ~60k-line module needs more than
# the old 2 GB, and metaspace is capped so the daemon does not creep.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Only package the resources/sources actually referenced.
android.enableResourceOptimizations=true

kotlin.code.style=official
# Run the Kotlin compiler inside the Gradle daemon instead of forking a second
# JVM; on CI runners and low-RAM machines this is both faster and lighter.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

ksp.incremental=true
ksp.useKSP2=true
